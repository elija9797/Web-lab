<!DOCTYPE html>
<html>
<head>
<title>Time Table</title>

<style>
table{
    border-collapse: collapse;
}

th, td{
    border:1px solid black;
    padding:10px;
    text-align:center;
}
</style>

</head>
<body>

<table>

<tr>
    <th colspan="6">Time Table</th>
</tr>

<tr>
    <td rowspan="6">Hours</td>
    <th>Mon</th>
    <th>Tue</th>
    <th>Wed</th>
    <th>Thu</th>
    <th>Fri</th>
</tr>

<tr>
    <td>Math</td>
    <td>Science</td>
    <td>Math</td>
    <td>Science</td>
    <td>Arts</td>
</tr>

<tr>
    <td>Math</td>
    <td>Science</td>
    <td>Math</td>
    <td>Science</td>
    <td>Arts</td>
</tr>

<tr>
    <th colspan="5">Lunch</th>
</tr>

<tr>
    <td>Math</td>
    <td>Science</td>
    <td>Math</td>
    <td rowspan="2" colspan="2">Project</td>
</tr>

<tr>
    <td>Math</td>
    <td>Science</td>
    <td>Math</td>
</tr>

</table>

</body>
</html>
