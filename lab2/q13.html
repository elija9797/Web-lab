<!DOCTYPE html>
<html>
<head>
    <title>Cookie Example</title>
</head>
<body>

<button onclick="setCookie()">Store Cookie</button>
<button onclick="getCookie()">Read Cookie</button>
<button onclick="deleteCookie()">Delete Cookie</button>

<p id="result"></p>

<script>
function setCookie(){
    document.cookie =
        "username=John; expires=Fri, 31 Dec 2030 23:59:59 UTC; path=/";

    alert("Cookie Stored");
}

function getCookie(){
    document.getElementById("result").innerHTML =
        document.cookie;
}

function deleteCookie(){
    document.cookie =
        "username=; expires=Thu, 01 Jan 1970 00:00:00 UTC; path=/";

    alert("Cookie Deleted");
}
</script>

</body>
</html>
