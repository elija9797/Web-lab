<!DOCTYPE html>
<html>
<head>
<title>Responsive Menu</title>

<style>

body{
    margin:0;
    font-family:Arial, sans-serif;
}

.navbar{
    background:#003366;
    overflow:hidden;
}

.logo{
    float:left;
    color:white;
    font-size:30px;
    padding:15px 20px;
}

.navbar ul{
    list-style:none;
    margin:0;
    padding:0;
    float:right;
}

.navbar ul li{
    display:inline-block;
}

.navbar ul li a{
    color:white;
    text-decoration:none;
    padding:25px 15px;
    display:block;
}

.navbar ul li a:hover{
    background:#005599;
}

/* Responsive Design */
@media screen and (max-width:768px){

.navbar ul{
    float:none;
    width:100%;
}

.navbar ul li{
    display:block;
    text-align:center;
}

.logo{
    float:none;
    text-align:center;
}

}

</style>
</head>

<body>

<div class="navbar">

<div class="logo">Mystery Code</div>

<ul>
<li><a href="#">Home</a></li>
<li><a href="#">About Us</a></li>
<li><a href="#">Service</a></li>
<li><a href="#">Portfolio</a></li>
<li><a href="#">Blog</a></li>
<li><a href="#">Contact Us</a></li>
</ul>

</div>

</body>
</html>
