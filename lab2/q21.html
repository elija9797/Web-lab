<!DOCTYPE html>
<html>
<head>
<title>Animation</title>

<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

<style>
#box{
width:100px;
height:100px;
background:green;
position:relative;
}
</style>
</head>
<body>

<div id="box"></div>
<br>

<button>Animate</button>

<script>
$(document).ready(function(){

$("button").click(function(){

$("#box").animate({
left:'300px',
width:'200px'
});

});

});
</script>

</body>
</html>
