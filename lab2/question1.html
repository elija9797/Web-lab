<!DOCTYPE html>
<html>
<head>
    <title>Types of JS</title>
    <!-- External JS Link -->
    <script src="external-js.js"></script>
</head>
<body>

    <!-- 1. Internal JS Call -->
    <button onclick="internal()">Internal</button>

    <!-- 2. Inline JS -->
    <button onclick="alert('Hello, I am an example of Inline JS')">Inline</button>

    <!-- 3. External JS Call -->
    <button onclick="fun()">External</button>

    <!-- Internal JS Script -->
    <script>
        function internal() {
            alert("Hi, I am an Internal JS example!");
        }
    </script>

</body>
</html>
