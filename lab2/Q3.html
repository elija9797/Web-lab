<!DOCTYPE html>
<html>
<head>
<title>Larger and Smaller</title>
</head>
<body>

<script>
let a = parseInt(prompt("Enter first number"));
let b = parseInt(prompt("Enter second number"));

if(a>b){
    document.write("Larger number = " + a + "<br>");
    document.write("Smaller number = " + b);
}
else{
    document.write("Larger number = " + b + "<br>");
    document.write("Smaller number = " + a);
}
</script>

</body>
</html>
