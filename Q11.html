<!DOCTYPE html>
<html>
<head>
<title>Dropdown Menu</title>

<style>

body{
    font-family: Arial;
}

.navbar{
    background-color: #333;
    overflow: hidden;
}

.navbar a{
    float: left;
    color: white;
    text-decoration: none;
    padding: 14px 16px;
}

.dropdown{
    float: left;
    overflow: hidden;
}

.dropdown .dropbtn{
    border: none;
    outline: none;
    color: white;
    padding: 14px 16px;
    background-color: inherit;
    font-size: 16px;
}

.dropdown-content{
    display: none;
    position: absolute;
    background-color: #f1f1f1;
    min-width: 160px;
}

.dropdown-content a{
    float: none;
    color: black;
    display: block;
    text-align: left;
    padding: 12px 16px;
}

.dropdown:hover .dropdown-content{
    display: block;
}

.dropdown-content a:hover{
    background-color: lightgray;
}

</style>
</head>

<body>

<div class="navbar">

<a href="#">Home</a>

<div class="dropdown">
<button class="dropbtn">Services</button>

<div class="dropdown-content">
<a href="#">Web Design</a>
<a href="#">Web Development</a>
<a href="#">SEO</a>
</div>

</div>

<a href="#">Gallery</a>
<a href="#">Contact</a>

</div>

</body>
</html>
