<!DOCTYPE html>
<html>
<head>
    <title>Lok Sewa Form</title>

    <style>
        body {
            font-family: Arial;
            background: #f2f2f2;
        }

        .form-box {
            width: 300px;
            margin: 40px auto;
            background: #fff;
            padding: 20px;
            box-shadow: 0 0 5px grey;
        }

        h2 {
            text-align: center;
        }

        label {
            display: block;
            margin-top: 10px;
        }

        input, select, textarea {
            width: 90%;
            padding: 6px;
            margin-top: 5px;
        }

        button {
            width: 50%;
            padding: 8px;
            margin-top: 15px;
            background: orange;
            border: none;
            color: white;
        }
    </style>
</head>

<body>

<div class="form-box">

<h2>Lok Sewa Ayog Registration</h2>

<form>

<label>Full Name</label>
<input type="text">

<br>

<label>Email</label>
<input type="email">

<br>

<label>Password</label>
<input type="password">

<br>

<label>Phone Number</label>
<input type="text">

<br>

<label>Gender</label>

<select>
    <option>Male</option>
    <option>Female</option>
</select>

<br><br>

<label>Address</label>
<textarea></textarea>

<br>

<button type="submit">Register</button>

</form>

</div>

</body>
</html>
