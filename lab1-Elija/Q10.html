<!DOCTYPE html>
<html>
<head>

<title>Navigation Bar</title>

<style>

body{
    margin:0;
}

.navbar{
    background-color:yellow;
    padding:20px;
}

.navbar a{
    text-decoration:none;
    color:blue;
    padding:15px 25px;
    font-size:22px;
    border-right:2px solid black;
}

.navbar a:hover{
    background-color:blue;
    color:white;
}

</style>

</head>
<body>

<div class="navbar">

<a href="#">Home</a>
<a href="#">About</a>
<a href="#">Services</a>
<a href="#">Gallery</a>
<a href="#">Contact</a>

</div>

</body>
</html>
