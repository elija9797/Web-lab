<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image Gallery</title>
    <link rel="stylesheet" href="Q20.css">
</head>
<body>

<div class="gallery-container">
    <h1>HOVER-EFFECT CSS</h1>

    <div class="gallery">

        <div class="card zoomin">
            <img src="https://picsum.photos/id/1015/300/200" alt="">
            <p>Hover-ZoomIn</p>
        </div>

        <div class="card fade">
            <img src="https://picsum.photos/id/1016/300/200" alt="">
            <p>Hover-Fade</p>
        </div>

        <div class="card blur">
            <img src="https://picsum.photos/id/1018/300/200" alt="">
            <div class="overlay">Hover Blur</div>
            <p>Hover-Blur</p>
        </div>

        <div class="card mask">
            <img src="https://picsum.photos/id/1020/300/200" alt="">
            <div class="overlay">Hover Mask</div>
            <p>Hover-Mask</p>
        </div>

        <div class="card zoomout">
            <img src="https://picsum.photos/id/1024/300/200" alt="">
            <p>Hover-ZoomOut</p>
        </div>

        <div class="card blurout">
            <img src="https://picsum.photos/id/1035/300/200" alt="">
            <p>Hover-BlurOut</p>
        </div>

        <div class="card text">
            <img src="https://picsum.photos/id/1040/300/200" alt="">
            <div class="overlay">Overlay Text</div>
            <p>Overlay Text</p>
        </div>

        <div class="card fall">
            <img src="https://picsum.photos/id/1050/300/200" alt="">
            <p>Hover-Fall</p>
        </div>

    </div>
</div>

</body>
</html>
